# HuBMAP Publication entities list the datasets they used as ancestors; 40-build-ftu-datasets-jsonld.py
# searches them for each HuBMAP dataset and its raw (parent) datasets, where `publication` is empty
HUBMAP_SEARCH_API : https://search.api.hubmapconsortium.org/v3/portal/search
# Publication DOI per HuBMAP dataset ID (null if none), cached between runs; delete it to look up again
HUBMAP_PUBLICATIONS_CACHE : hubmap-publications-cache.json
# HuBMAP publications that reuse or describe the data but aren't its source, never used as a dataset's publication
HUBMAP_EXCLUDED_PUBLICATION_DOIS :
  # Construction, Deployment, and Usage of the Human Reference Atlas Knowledge Graph
  - 10.1038/s41597-025-05183-6
  # Cell type populations for 3D anatomical structures of the Human Reference Atlas
  - 10.1038/s41597-026-06642-4
  # HuBMAP Data Portal: A Resource for Multimodal Spatial and Single-Cell Data of Healthy Human Tissues
  - 10.48550/arXiv.2511.05708